# Pre-commit hooks (build plan step 0.4: "Pre-commit hooks, Conventional
# Commits enforcement").
#
# Install once with:
#   pip install pre-commit && pre-commit install
#
# The hooks run the same tools as CI, so a commit that passes here will
# pass the build. The mypy, eslint and tsc hooks are "local" hooks
# because they need the project's own environment, which pre-commit
# cannot create on its own; run `pip install -r backend/requirements.txt`
# and `npm ci` in frontend/ before using them.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix, --config, backend/pyproject.toml]
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && mypy app tests'
        language: system
        pass_filenames: false
        files: ^backend/(app|tests)/.*\.py$

      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$

      - id: tsc
        name: tsc (frontend)
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$

      - id: conventional-commit
        name: conventional commit message with a task id
        entry: bash infra/scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
