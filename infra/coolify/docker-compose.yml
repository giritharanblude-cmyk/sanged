# SANGAD — Coolify Docker Compose
# Deployed through Coolify as a Compose application.
# Do NOT edit or run this file directly on the host.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    domain: sangad.localhost
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_FILES=${S3_BUCKET_FILES}
      - S3_BUCKET_BACKUPS=${S3_BUCKET_BACKUPS}
      - S3_FORCE_PATH_STYLE=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENWA_API_URL=${OPENWA_API_URL}
      - OPENWA_API_KEY=${OPENWA_API_KEY}
      - OPENWA_WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET}
      - EXTRACTION_PROVIDER=${EXTRACTION_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["rq", "worker", "--url", "${REDIS_URL}", "sangad-jobs"]
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_FILES=${S3_BUCKET_FILES}
      - S3_BUCKET_BACKUPS=${S3_BUCKET_BACKUPS}
      - S3_FORCE_PATH_STYLE=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENWA_API_URL=${OPENWA_API_URL}
      - OPENWA_API_KEY=${OPENWA_API_KEY}
      - EXTRACTION_PROVIDER=${EXTRACTION_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_ENV=${APP_ENV}
    restart: no

  openwa:
    image: openwa.dev/openwa:0.23.5
    environment:
      - ENGINE_TYPE=baileys
      - API_KEY=${OPENWA_API_KEY}
      - WEBHOOK_URL=http://api:8001/internal/v1/channels/whatsapp/webhook
      - WEBHOOK_EVENTS=message.received,session.status
      - WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET}
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped

volumes:
  openwa_data: