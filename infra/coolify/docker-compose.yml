# SANGAD — Coolify Docker Compose
# Deployed through Coolify as a Compose application.
#
# Local/dev deviations from docs/SANGAD_ARCHITECTURE_v0_3.md, both deliberate:
#   * ADR-16 puts Postgres/Redis in Coolify database resources. Here they are
#     compose services so a clean checkout comes up self-contained. Move them to
#     Coolify resources (and point DATABASE_URL/REDIS_URL at them) for production
#     so Coolify's scheduled backups cover them.
#   * The `migrate` service was dropped: there is no alembic.ini or migrations/
#     directory in the repo yet, so `alembic upgrade head` cannot succeed. It
#     comes back with T-003 (Alembic).
#   * The `openwa` service was dropped: image `openwa.dev/openwa:0.23.5` does not
#     exist on any registry. It is a Phase 2 task (T-212).

services:
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    domains:
      - sangad.localhost
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_FILES=${S3_BUCKET_FILES}
      - S3_BUCKET_BACKUPS=${S3_BUCKET_BACKUPS}
      - S3_FORCE_PATH_STYLE=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENWA_API_URL=${OPENWA_API_URL}
      - OPENWA_API_KEY=${OPENWA_API_KEY}
      - OPENWA_WEBHOOK_SECRET=${OPENWA_WEBHOOK_SECRET}
      - EXTRACTION_PROVIDER=${EXTRACTION_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["rq", "worker", "--url", "${REDIS_URL}", "sangad-jobs"]
    environment:
      - APP_ENV=${APP_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_FILES=${S3_BUCKET_FILES}
      - S3_BUCKET_BACKUPS=${S3_BUCKET_BACKUPS}
      - S3_FORCE_PATH_STYLE=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENWA_API_URL=${OPENWA_API_URL}
      - OPENWA_API_KEY=${OPENWA_API_KEY}
      - EXTRACTION_PROVIDER=${EXTRACTION_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16.10-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: