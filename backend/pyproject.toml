[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sangad-api"
version = "0.1.0"
description = "SANGAD Admin Dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "redis>=5.2",
    "rq>=1.16",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-docx>=1.1",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "psycopg2-binary>=2.9",
    "sentry-sdk>=2.20",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.15",
    "pre-commit>=4.1",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]
where = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "A", "C4", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
