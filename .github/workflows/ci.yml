name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: mypy app tests

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run test -- --coverage
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The scan runs against the resolved dependency set rather than an
      # unresolved specifier file, so it reports a real vulnerable version
      # instead of "may be present". pip is brought up to date first because
      # the scan covers the whole environment and the bundled pip carries
      # advisories of its own.
      - name: Audit the Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install safety==3.8.1
          safety check
      - name: Audit the frontend dependencies
        run: npm audit --audit-level=high
        working-directory: ./frontend

  dev-stack:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      POSTGRES_DB: sangad
      POSTGRES_USER: sangad
      APP_DB_USER: sangad_app
      ALLOWED_HOSTS: localhost,sangad.localhost,127.0.0.1
      COOKIE_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate isolated CI credentials
        run: |
          POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          APP_DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          S3_ACCESS_KEY="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          S3_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          ENCRYPTION_KEY="$(python -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "APP_DB_PASSWORD=$APP_DB_PASSWORD"
            echo "S3_ACCESS_KEY=$S3_ACCESS_KEY"
            echo "S3_SECRET_KEY=$S3_SECRET_KEY"
            echo "SECRET_KEY=$SECRET_KEY"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "ENCRYPTION_KEY=$ENCRYPTION_KEY"
            echo "DATABASE_URL=postgresql+psycopg2://sangad:$POSTGRES_PASSWORD@postgres:5432/sangad"
          } >> "$GITHUB_ENV"
      - run: cp .env.example .env
      - run: npm ci
        working-directory: ./frontend
      - run: npx playwright install --with-deps chromium
        working-directory: ./frontend
      - run: docker compose -f docker-compose.dev.yml up --build -d --wait --wait-timeout 300
      - run: |
          curl --fail http://127.0.0.1:5173/ >/dev/null
          docker compose -f docker-compose.dev.yml exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz').read().decode())"
          curl --fail -H 'Host: sangad.localhost' http://127.0.0.1:8088/openapi.json | diff -u frontend/openapi.json -
      - run: PLAYWRIGHT_ADMIN_PASSWORD="$ADMIN_PASSWORD" npm run test:e2e
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://sangad.localhost:5173
          PLAYWRIGHT_MAILPIT_URL: http://127.0.0.1:8025
      - run: docker compose -f docker-compose.dev.yml exec -T api sh -c 'DATABASE_URL="$TEST_DATABASE_URL" REDIS_URL="$TEST_REDIS_URL" pytest --cov=app --cov-fail-under=80'
      - run: |
          docker compose -f docker-compose.dev.yml exec -T api sh -c 'MIGRATION_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" alembic upgrade head && MIGRATION_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" alembic downgrade base && MIGRATION_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" alembic upgrade head'
      - if: always()
        run: docker compose -f docker-compose.dev.yml down -v